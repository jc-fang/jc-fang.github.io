# Intro paragraphs. HTML allowed, so add links freely.
intro:
  - >-
    I am a postdoc at the University of Chicago Data Science Institute, working with
    <a href="https://minalee-research.github.io/">Mina Lee</a>. My research interests lie at the
    intersection of <strong>Human-Computer Interaction</strong>, <strong>Social Computing</strong>, and <strong>Responsible AI</strong>. I design and evaluate
    human-centered technology to support users' learning and knowledge work, focusing primarily on online education and AI-assisted writing contexts. 
    I approach this goal from two angles: (1) designing interactive systems that scaffold cognitive processes in sensemaking and content creation, and (2) fostering responsible use of technology.
  - >-
    I previously earned a PhD in Computer Science from UC Davis, advised by
    <a href="http://www.haochuanwang.info/">Hao-Chuan Wang</a>, and dual BSc degrees in Mathematics
    and Computer Science from the University of Minnesota, Twin Cities.
