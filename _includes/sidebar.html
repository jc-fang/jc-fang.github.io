{% assign p = site.data.profile %}
<aside class="sidebar">
  <img class="sidebar__photo" src="{{ p.photo | relative_url }}" alt="Photo of {{ p.name }}">
  <h1 class="sidebar__name">{{ p.name }}</h1>
  <p class="sidebar__info">
    {% for line in p.info %}{{ line }}{% unless forloop.last %}<br>{% endunless %}{% endfor %}
  </p>
  <ul class="sidebar__links">
    {% for link in p.links %}
    <li>
      <a href="{{ link.url | relative_url }}">
        {% include icon.html name=link.icon %}<span>{{ link.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% if p.notice %}<p class="sidebar__notice">{{ p.notice }}</p>{% endif %}
</aside>
